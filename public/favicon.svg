<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="planet" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffb840"/>
      <stop offset="0.55" stop-color="#ff8c2e"/>
      <stop offset="1" stop-color="#b8461c"/>
    </radialGradient>
    <clipPath id="front">
      <rect x="0" y="32" width="64" height="32"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0d1117"/>
  <g fill="#e6edf3">
    <circle cx="12" cy="13" r="1.2"/>
    <circle cx="52" cy="50" r="1"/>
    <circle cx="49" cy="11" r="0.9"/>
  </g>
  <!-- orbit: back half behind the planet -->
  <ellipse cx="32" cy="32" rx="27" ry="10" transform="rotate(-25 32 32)"
           fill="none" stroke="#00e5ff" stroke-width="3" stroke-opacity="0.45"/>
  <circle cx="32" cy="32" r="14" fill="url(#planet)"/>
  <!-- orbit: front half over the planet -->
  <g clip-path="url(#front)" transform="rotate(-25 32 32)">
    <ellipse cx="32" cy="32" rx="27" ry="10" fill="none" stroke="#00e5ff" stroke-width="3"/>
  </g>
  <!-- spacecraft on the orbit -->
  <circle cx="56.6" cy="23.6" r="4.2" fill="#e6edf3" stroke="#0d1117" stroke-width="1.5"/>
</svg>
